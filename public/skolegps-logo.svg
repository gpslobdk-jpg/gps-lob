<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">SkoleGPS logo</title>
  <desc id="desc">A blue route arrow and map pin beside the SkoleGPS wordmark.</desc>
  <defs>
    <linearGradient id="pin" x1="38" y1="24" x2="136" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69d7ff" />
      <stop offset="0.52" stop-color="#0377d8" />
      <stop offset="1" stop-color="#0054a8" />
    </linearGradient>
    <linearGradient id="gps" x1="382" y1="48" x2="566" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="0.52" stop-color="#0377d8" />
      <stop offset="1" stop-color="#22a447" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#071a3a" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="18" y="24" width="134" height="118" rx="38" fill="#ffffff" opacity="0.96" />
    <path
      d="M38 112c21-34 55-39 85-17"
      fill="none"
      stroke="#9bd5ff"
      stroke-width="8"
      stroke-linecap="round"
      stroke-dasharray="1 15"
    />
    <path
      d="M78 118 121 72m0 0-4 34m4-34-34 5"
      fill="none"
      stroke="#22a447"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M86 24c-29 0-52 23-52 52 0 40 52 86 52 86s52-46 52-86c0-29-23-52-52-52Z"
      fill="url(#pin)"
      stroke="#ffffff"
      stroke-width="8"
    />
    <circle cx="86" cy="76" r="19" fill="#ffffff" />
    <circle cx="86" cy="76" r="8" fill="#071a3a" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="178" y="105" font-size="67" letter-spacing="0" fill="#071a3a">Skole</text>
    <text x="385" y="105" font-size="67" letter-spacing="0" fill="url(#gps)">GPS</text>
    <text x="551" y="108" font-size="30" letter-spacing="0" fill="#0377d8">.dk</text>
    <text x="181" y="137" font-size="18" font-weight="800" letter-spacing="0" fill="#16406f">LÆRING I DEN VIRKELIGE VERDEN</text>
  </g>
</svg>
